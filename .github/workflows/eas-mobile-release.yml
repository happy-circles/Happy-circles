name: EAS Mobile Testing Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      auto_submit:
        description: Submit completed builds to the configured testing tracks
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-and-submit-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Validate release source and credentials
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production testing builds must be dispatched from main."
            exit 1
          fi

          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is not configured."
            exit 1
          fi

          if [ "${{ inputs.auto_submit }}" = "true" ] && [ "${{ inputs.platform }}" != "ios" ]; then
            echo "::error::Android auto-submit is disabled until a Play submission service account is configured."
            exit 1
          fi

          conclusion="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow security-ci.yml \
            --commit "${GITHUB_SHA}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')"

          if [ "${conclusion}" != "success" ]; then
            echo "::error::Security CI must pass for ${GITHUB_SHA} before an EAS build."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Queue and wait for EAS production build
        working-directory: apps/mobile
        shell: bash
        run: |
          args=(
            build
            --platform "${{ inputs.platform }}"
            --profile production
            --non-interactive
            --wait
          )

          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            args+=(--auto-submit)
          fi

          pnpm dlx eas-cli@21.7.1 "${args[@]}"

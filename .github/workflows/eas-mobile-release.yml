name: EAS Mobile Testing Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      auto_submit:
        description: Submit completed builds to the configured testing tracks
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-and-submit-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Validate release source and credentials
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production testing builds must be dispatched from main."
            exit 1
          fi

          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is not configured."
            exit 1
          fi

          conclusion="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow security-ci.yml \
            --commit "${GITHUB_SHA}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')"

          if [ "${conclusion}" != "success" ]; then
            echo "::error::Security CI must pass for ${GITHUB_SHA} before an EAS build."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production update configuration and backend
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: '1'
        run: |
          runtime="$(node -p "require('./update-policy.json').runtimeVersion")"
          pnpm dlx eas-cli@21.7.1 env:exec production \
            "node ../../scripts/check-eas-update.mjs --target production --environment production --expected-runtime ${runtime}" \
            --non-interactive

      - name: Verify Android submission credentials
        if: ${{ inputs.auto_submit && inputs.platform != 'ios' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { projectId } = JSON.parse(readFileSync('apps/mobile/update-policy.json', 'utf8'));
          const response = await fetch('https://api.expo.dev/graphql', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: `Bearer ${process.env.EXPO_TOKEN}`,
            },
            body: JSON.stringify({
              query: `query AndroidSubmissionCredentials($appId: String!) {
                app { byId(appId: $appId) {
                  androidAppCredentials(filter: { applicationIdentifier: "com.happycircles.app" }) {
                    googleServiceAccountKeyForSubmissions { id }
                  }
                } }
              }`,
              variables: { appId: projectId },
            }),
            signal: AbortSignal.timeout(30_000),
          });
          const result = await response.json();
          if (!response.ok || result.errors) {
            throw new Error('Unable to verify Android submission credentials in EAS.');
          }
          const credentials = result.data?.app?.byId?.androidAppCredentials;
          if (!credentials?.some((entry) => entry.googleServiceAccountKeyForSubmissions?.id)) {
            throw new Error('A Play Store submission service account must be configured in EAS.');
          }
          console.log('Android submission credentials verified in EAS.');
          NODE

      - name: Queue and wait for EAS production build
        working-directory: apps/mobile
        shell: bash
        run: |
          args=(
            build
            --platform "${{ inputs.platform }}"
            --profile production
            --non-interactive
            --wait
          )

          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            args+=(--auto-submit)
          fi

          pnpm dlx eas-cli@21.7.1 "${args[@]}"

name: EAS Mobile Testing Release

on:
  workflow_run:
    workflows:
      - Security CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-submit-testing:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Queue EAS production builds
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@latest build --platform all --profile production --non-interactive --no-wait --auto-submit
